name: Yarn migration debug

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - name: Enable Corepack and pin Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.0 --activate
          node --version
          yarn --version

      - name: Run yarn install for migration
        id: yarn_install
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          yarn install 2>&1 | tee artifacts/yarn-install.log
          echo "${PIPESTATUS[0]}" > artifacts/yarn-install.exitcode
          exit 0

      - name: Print diagnostics
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "=== git status ==="
            git status --short
            echo
            echo "=== git diff ==="
            git diff -- package.json yarn.lock .yarnrc.yml .yarn
            echo
            echo "=== yarn explain peer-requirements ==="
            yarn explain peer-requirements || true
            echo
            echo "=== yarn why redux ==="
            yarn why redux || true
          } | tee artifacts/diagnostics.log

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yarn-migration-debug
          path: |
            artifacts/**
            package.json
            yarn.lock
            .yarnrc.yml
            .yarn/**
          if-no-files-found: warn
          include-hidden-files: true