name: Build lokinet-gui

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 16.13.0

      - name: Setup Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build AppImage (Ubuntu)
        if: runner.os == 'Linux'
        run: yarn appImage

      - name: Upload AppImage (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lokinet-gui-ubuntu-appimage
          path: release/*.AppImage
          if-no-files-found: error

      - name: Build deb (Ubuntu)
        if: runner.os == 'Linux'
        run: yarn deb

      - name: Upload deb (Ubuntu)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lokinet-gui-ubuntu-deb
          path: release/*.deb
          if-no-files-found: error

      - name: Build exe (Windows)
        if: runner.os == 'Windows'
        run: yarn win32

      - name: Upload exe (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lokinet-gui-windows-exe
          path: release/*portable.exe
          if-no-files-found: error
